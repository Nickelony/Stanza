StylesPath = .vale/styles
MinAlertLevel = error

# Vale reads the comments of a format it parses, so YAML, .editorconfig, the git files and this file are read as a format whose comments start with #.
[formats]
yml = py
editorconfig = py
gitattributes = py
gitignore = py
ini = py

[*.{md,cs,ps1,yml,editorconfig,csproj,props,targets,slnx,config,Config,gitattributes,gitignore,ini}]
BasedOnStyles = Stanza

# STYLEGUIDE.md quotes the phrases it bans, so only those rules skip it.
[STYLEGUIDE.md]
Stanza.Census = NO
Stanza.History = NO
Stanza.Padding = NO
Stanza.UsedTo = NO

# The release tracking writes its own rows.
[src/Nickelony.Stanza.Analyzers/AnalyzerReleases.*.md]
BasedOnStyles =
