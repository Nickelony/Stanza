name: Bug report
description: Report something that does not work the way the documentation says it does.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Which product is affected?
      description: The package the problem is in, or the documentation.
      options:
        - Nickelony.Stanza.Analyzers
        - Nickelony.Stanza.Markup (stanza-markup)
        - Nickelony.Stanza.Format (stanza-format)
        - Documentation
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The package version, or the output of the tool's `--version` (`dotnet <tool> --version` when the tool is installed locally).
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: >-
        The host the problem appears in: the edition and version of Visual Studio,
        of Visual Studio Code (with the version of its C# extension) or of the .NET SDK,
        plus the operating system.
      placeholder: Visual Studio 17.11.5 on Windows 11 / dotnet 8.0.404 on Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest input that shows the problem:
        a C# snippet for the analyzer rules, or the files a tool ran on and the command line that ran it.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual output
      description: What you expected to happen, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: editorconfig
    attributes:
      label: Relevant .editorconfig lines
      description: >-
        The `.editorconfig` lines that apply:
        the severity of each rule the report is about, and any option the rule or the tool reads.
      render: ini
    validations:
      required: false
