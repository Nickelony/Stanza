name: Pages

# The configurator is built from the files that site/README.md lists, which the paths below name,
# so a change to one of them rebuilds it, and a page the site cannot parse fails the pull request.
# Its lint loads JS Stanza, which is built from js/src, so those files and the packages of js/ are named too.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/rules/**'
      - 'docs/options/**'
      - 'docs/Markup-behavior.md'
      - 'docs/Which-rule-owns-which-gap.md'
      - 'docs/Working-with-formatters.md'
      - 'src/Nickelony.Stanza.Analyzers/README.md'
      - 'src/Nickelony.Stanza.Analyzers.Package/levels.txt'
      - 'src/Nickelony.Stanza.Markup.Core/MarkupDiagnostics.cs'
      - 'js/docs/rules/**'
      - 'js/README.md'
      - 'js/docs/Rule-map.md'
      - 'js/src/**'
      - 'js/package.json'
      - 'js/package-lock.json'
      - 'js/tsconfig.json'
      - 'js/tsconfig.build.json'
      - 'py/docs/rules/**'
      - 'py/src/nickelony_stanza/rules/**'
      - 'py/README.md'
      - 'py/docs/Configuration.md'
      - 'py/docs/Rule-map.md'
      - 'py/src/nickelony_stanza/options.py'
      - 'py/src/nickelony_stanza/config.py'
      - 'py/src/nickelony_stanza/formatter.py'
      - 'icon/Stanza.png'
      - 'icon/Stanza-Mu.png'
      - 'icon/Stanza-JS.png'
      - 'icon/Stanza-Py.png'
      - 'icon/Stanza.svg'
      - 'icon/Stanza-Mu.svg'
      - 'icon/Stanza-JS.svg'
      - 'icon/Stanza-Py.svg'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/rules/**'
      - 'docs/options/**'
      - 'docs/Markup-behavior.md'
      - 'docs/Which-rule-owns-which-gap.md'
      - 'docs/Working-with-formatters.md'
      - 'src/Nickelony.Stanza.Analyzers/README.md'
      - 'src/Nickelony.Stanza.Analyzers.Package/levels.txt'
      - 'src/Nickelony.Stanza.Markup.Core/MarkupDiagnostics.cs'
      - 'js/docs/rules/**'
      - 'js/README.md'
      - 'js/docs/Rule-map.md'
      - 'js/src/**'
      - 'js/package.json'
      - 'js/package-lock.json'
      - 'js/tsconfig.json'
      - 'js/tsconfig.build.json'
      - 'py/docs/rules/**'
      - 'py/src/nickelony_stanza/rules/**'
      - 'py/README.md'
      - 'py/docs/Configuration.md'
      - 'py/docs/Rule-map.md'
      - 'py/src/nickelony_stanza/options.py'
      - 'py/src/nickelony_stanza/config.py'
      - 'py/src/nickelony_stanza/formatter.py'
      - 'icon/Stanza.png'
      - 'icon/Stanza-Mu.png'
      - 'icon/Stanza-JS.png'
      - 'icon/Stanza-Py.png'
      - 'icon/Stanza.svg'
      - 'icon/Stanza-Mu.svg'
      - 'icon/Stanza-JS.svg'
      - 'icon/Stanza-Py.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A new push to a pull request supersedes its running build.
# A deployment is never canceled midway, so the next one waits for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token is read-only by default; the deploy job declares what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            js/package-lock.json

      # The lint loads JS Stanza from its build, and the site links the package from js/.
      - name: Install the packages of JS Stanza
        working-directory: js
        run: npm ci

      - name: Build JS Stanza
        working-directory: js
        run: npm run build

      - name: Install the packages
        run: npm ci

      - name: Check the formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run typecheck

      # The tests read the rule and option pages, so a page that does not parse fails here.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A pull request builds and tests only; the artifact is for the deploy job.
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # A manual run on another branch builds and tests, and publishes nothing.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
